# ===================================================================
# DataY Web 调度 master + worker 合并部署 profile
#
# 用法：--spring.profiles.active=prod,cluster
#
# 合并部署节点同时具备调度与执行能力：
#   - 参与 Leader 选举，当选节点负责 Quartz 调度与调度事件处理
#   - 同时消费待执行任务队列并执行任务
# 等价于开启集群能力的单进程部署方式
# ===================================================================

development:
  mode: cluster
