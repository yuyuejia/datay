# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: datafusion
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: datafusion-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: datafusion-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'datafusionApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: datay@yuyuejia.com.cn
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Datafusion API
    description: Datafusion API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:"

# ===================================================================
# AI 助手配置
# 兼容 OpenAI Chat Completions 协议，OpenAI / DeepSeek / 通义千问 / Ollama 均可对接。
# 也可通过环境变量覆盖：DATAY_AI_BASE_URL / DATAY_AI_API_KEY / DATAY_AI_MODEL
# ===================================================================
datay:
  ai:
    enabled: true
    base-url: ${DATAY_AI_BASE_URL:https://api.deepseek.com}
    api-key: ${DATAY_AI_API_KEY:}
    model: ${DATAY_AI_MODEL:deepseek-flash}
    temperature: 0.2
    timeout-seconds: 120
    # Agent 循环最大轮次：模型「思考-调用工具-再思考」的上限，达到后强制输出最终 SQL
    max-tool-rounds: 6
    # 单轮允许的最大工具调用次数，防止模型滥用工具
    max-tool-calls-per-round: 8
    # 是否允许调用具备副作用的写工具，默认关闭；需与助手自身声明同时放行
    allow-mutating-tools: false
    # 指标问数知识库（RAG）：把指标、维度字段、维度成员向量化到独立 DuckDB，提升模糊匹配精度
    rag:
      enabled: true
      # 索引文件，与业务数仓隔离
      db-file: ./data/metric-rag.duckdb
      # 向量化提供方：local（本地字符 n-gram，开箱可用）/ openai（OpenAI 兼容 /embeddings）
      provider: ${DATAY_AI_RAG_PROVIDER:local}
      # 本地向量维度
      local-dimensions: 512
      # 外部 embedding 配置，provider=openai 时生效；api-key 缺省回退 datay.ai.api-key
      embedding-base-url: ${DATAY_AI_RAG_EMBEDDING_BASE_URL:}
      embedding-model: ${DATAY_AI_RAG_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-api-key: ${DATAY_AI_RAG_EMBEDDING_API_KEY:}
      embedding-timeout-seconds: 60
      # 默认每类候选数量
      top-k: 8
      # 是否索引维度成员值（如「北京」）
      member-index-enabled: true
      # 单字段成员抽样上限
      member-sample-limit: 200
  # 决策模型（Ollama Jev-style，/v1/systemone）：本地低延迟决策，供「决策模型」组件使用
  # 也可通过环境变量覆盖：DATAY_DECISION_BASE_URL / DATAY_DECISION_API_KEY / DATAY_DECISION_MODEL
  decision:
    enabled: true
    base-url: ${DATAY_DECISION_BASE_URL:http://localhost:11434/v1}
    api-key: ${DATAY_DECISION_API_KEY:ollama}
    model: ${DATAY_DECISION_MODEL:nimble}
    timeout-seconds: 120
  # 数据库 JDBC 驱动按需下载：平台未内置的驱动（如达梦）在首次连接或手动下载时拉取到 drivers/ 目录
  driver:
    # Maven 仓库地址，逗号或分号分隔，按顺序回退；也可通过环境变量 DATAY_DRIVER_REPOS 覆盖
    repos: ${DATAY_DRIVER_REPOS:https://repo1.maven.org/maven2,https://maven.aliyun.com/repository/public}
  # 平台管理 Harness：通过 MCP 端点 /mcp/datay 暴露数据源、ETL 任务、数据模型等对象的增删改查与运行类操作
  mcp:
    harness:
      # 是否允许调用具备副作用的写工具（创建/修改/删除/运行任务等）。
      # 默认开启，因为该端点面向平台管理；生产环境如需只读，可设为 false 或注入 DATAY_MCP_HARNESS_ALLOW_MUTATING_TOOLS=false。
      allow-mutating-tools: ${DATAY_MCP_HARNESS_ALLOW_MUTATING_TOOLS:true}

# ===================================================================
# 部署与执行配置（development.*）
# ===================================================================
development:
  # ETL 任务执行方式：local 在当前 worker 进程内执行，docker 在独立容器中执行
  etl:
    mode: ${DATAY_ETL_MODE:local}
    docker:
      # 镜像需提供 Java 运行环境；任务 jar 通过挂载共享，无需打进镜像
      image: ${DATAY_ETL_DOCKER_IMAGE:eclipse-temurin:17-jre}
      # 运行时来源一：datay-core 可执行 jar（jar-with-dependencies）宿主机路径；配置后优先使用
      jar-path: ${DATAY_ETL_DOCKER_JAR_PATH:}
      # 运行时来源二：不配置 jar-path 时，直接引用 worker fat jar 内嵌的 core 运行时
      #（通过 Spring Boot PropertiesLauncher 加载 BOOT-INF/lib，无需单独构建/挂载 core jar）
      # 留空则自动探测当前运行的 worker jar；IDE/展开目录启动时需显式配置
      worker-jar-path: ${DATAY_ETL_DOCKER_WORKER_JAR_PATH:}
      # docker 网络模式，一般无需配置：默认网络已可访问局域网/公网数据源
      network: ${DATAY_ETL_DOCKER_NETWORK:}
      # 是否允许容器访问宿主机服务（默认开启，通常无需配置）：
      # 注入 --add-host host.docker.internal:host-gateway，并把任务中 localhost/127.0.0.1 地址
      # 改写为下方别名，使容器内 ETL 能直接连接跑在本机的数据库/模型服务
      host-access: ${DATAY_ETL_DOCKER_HOST_ACCESS:true}
      host-access-alias: ${DATAY_ETL_DOCKER_HOST_ACCESS_ALIAS:host.docker.internal}
      # 是否注入 host-gateway 映射（Linux 需要；Docker Desktop 可关闭）
      add-host-gateway: ${DATAY_ETL_DOCKER_ADD_HOST_GATEWAY:true}
      # 容器资源限制
      memory: ${DATAY_ETL_DOCKER_MEMORY:}
      cpus: ${DATAY_ETL_DOCKER_CPUS:}
      # 宿主机日志目录，缺省 <工作目录>/log；须与 worker 读取日志的目录一致，否则前端看不到日志
      host-log-dir: ${DATAY_ETL_DOCKER_HOST_LOG_DIR:}
      # 宿主机驱动目录，缺省 <工作目录>/drivers；挂载后容器可直接加载未内置的 JDBC 驱动
      driver-dir: ${DATAY_ETL_DOCKER_DRIVER_DIR:}
      # 宿主机数据目录，缺省 <工作目录>/data；挂载后容器可读写相对路径数据文件（如 ./data/xxx.duckdb）
      data-dir: ${DATAY_ETL_DOCKER_DATA_DIR:}
      # Maven 驱动仓库，透传给容器用于按需下载驱动
      driver-repos: ${DATAY_DRIVER_REPOS:}
      # 附加 lib 目录（宿主路径），逐个挂载到容器 <workDir>/lib 下并加入 classpath
      # lib-dirs:
      #   - /opt/datay/lib
      # 附加挂载，格式 hostPath:containerPath[:ro|rw]
      # extra-mounts:
      #   - /data/driver-jars:/data/driver-jars:ro

