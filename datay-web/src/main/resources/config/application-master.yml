# ===================================================================
# DataY Web 调度 master 独立部署 profile
#
# 用法：--spring.profiles.active=prod,master
#
# master 节点职责：
#   - 初始化 Quartz 调度、维护任务上线/下线
#   - 接收 worker 上报的任务状态并落库
#   - 通过 Redis 队列向 worker 分发待执行任务
# master 节点不执行任务，可水平多副本部署，由 Leader 选举保证调度唯一性
# ===================================================================

development:
  mode: master

# master 不提供任务执行能力，可关闭管理端以外的监控细节，按需调整
logging:
  level:
    com.data.datafusion.service.scheduler: INFO
    com.data.datafusion.service.cluster: INFO
